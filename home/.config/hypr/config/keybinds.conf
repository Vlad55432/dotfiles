# wev to detect whick key
# See https://wiki.hyprland.org/Configuring/Keywords/
$Mod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $Mod, T, exec, $uwsm $terminal # Launch Terminal
bind = $Mod, Q, killactive, # Kill active window
bind = $Mod, E, exec, $uwsm $fileManager # Launch File Manager
bind = $Mod Shift, E, exec, $uwsm kitty yazi # Launch TYI File Manager
bind = $Mod, W, togglefloating, # Toggle floating for active window
bind = $Mod, A, exec, rofi -show drun -run-command "uwsm app -- {cmd}" # Launch Menu
#bind = $Mod, P, pseudo, # dwindle
bind = $Mod, J, togglesplit, # dwindle 
bind = $Mod, F, fullscreen # Show app in Fullscreen
# Move focus with Mod + arrow keys
bind = $Mod, left, movefocus, l # Move focused window to left
bind = $Mod, right, movefocus, r # Move focused window to right
bind = $Mod, up, movefocus, u # Move focused window up
bind = $Mod, down, movefocus, d # Move focused window down
bind = $Mod, slash, exec, $HOME/.config/rofi/hypr-binds.sh
bind = Alt, tab, cyclenext, prev
# Switch workspaces with Mod + [0-9]
bind= $Mod, 1, workspace, 1
bind = $Mod, 2, workspace, 2
bind = $Mod, 3, workspace, 3
bind = $Mod, 4, workspace, 4
bind = $Mod, 5, workspace, 5
bind = $Mod, 6, workspace, 6
bind = $Mod, 7, workspace, 7
bind = $Mod, 8, workspace, 8
bind = $Mod, 9, workspace, 9
bind = $Mod, 0, workspace, 10

# Move active window to a workspace with Mod + SHIFT + [0-9]
bind = $Mod SHIFT, 1, movetoworkspace, 1
bind = $Mod SHIFT, 2, movetoworkspace, 2
bind = $Mod SHIFT, 3, movetoworkspace, 3
bind = $Mod SHIFT, 4, movetoworkspace, 4
bind = $Mod SHIFT, 5, movetoworkspace, 5
bind = $Mod SHIFT, 6, movetoworkspace, 6
bind = $Mod SHIFT, 7, movetoworkspace, 7
bind = $Mod SHIFT, 8, movetoworkspace, 8
bind = $Mod SHIFT, 9, movetoworkspace, 9
bind = $Mod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $Mod, S, togglespecialworkspace, magic
bind = $Mod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with Mod + scroll
bind = $Mod, mouse_down, workspace, e+1
bind = $Mod, mouse_up, workspace, e-1

# Move/resize windows with Mod + LMB/RMB and dragging
bindm = $Mod, mouse:272, movewindow
bindm = $Mod, mouse:273, resizewindow
#bindm = $Mod Shift, mouse:273, resizewindow 1

bind = $Mod Control Shift, right, resizeactive, 30 0
bind = $Mod Control Shift, left, resizeactive, -30 0
bind = $Mod Control Shift, up, resizeactive, 0 -30
bind = $Mod Control Shift, down, resizeactive, 0 30

bind = $Mod Shift, right, movewindow, r                                                                  
bind = $Mod Shift, left, movewindow, l                                                                  
bind = $Mod Shift, up, movewindow, u                                                                  
bind = $Mod Shift, down, movewindow, d 

# Sink volume toggle mute
bindel = , XF86AudioMute, exec, $uwsm swayosd-client $active-monitor --output-volume mute-toggle
# Source volume toggle mute
bindel = , XF86AudioMicMute, exec, $uwsm swayosd-client $active-monitor --input-volume mute-toggle

# Volume raise with custom value
bindel = ,  XF86AudioRaiseVolume, exec, $uwsm $(swayosd-client $active-monitor --output-volume 5)
# Volume lower with custom value
bindel = , XF86AudioLowerVolume, exec, $uwsm $(swayosd-client $active-monitor --output-volume -5)
bindel = , XF86Calculator, exec, $uwsm rofi -show calc
# Capslock (If you don't want to use the backend)
bindel = , --release Caps_Lock, exec, $uwsm $(swayosd-client $active-monitor --caps-lock)

#bindsym XF86MonBrightnessUp  exec swayosd-client $active-monitor --brightness +10
#bindsym XF86MonBrightnessDown exec swayosd-client $active-monitor --brightness -10


# expoooooooooo
#bind = SUPER, space, hyprexpo:expo, toggle

# uuctl
bind = Control Shift, Escape, exec, $uwsm $(uuctl)

bind = $Mod, O, exec, $uwsm wlogout -b 5 
bind = $Mod, p, exec, $uwsm hyprpicker -a | tee >(notify-send -t 2000 "Колір:" "$(cat)")

# Screenshot a window
bind = $Mod, PRINT, exec, $uwsm $(hyprshot --freeze --mode=window --raw --clipboard-only | swappy -f -)
# Screenshot a monitor
bind = , PRINT, exec, $uwsm $(hyprshot --freeze --mode=output --raw --clipboard-only | swappy -f -)
# Screenshot a region
bind = $Mod Shift, PRINT, exec, $uwsm $(hyprshot --freeze --mode=region --raw --clipboard-only | swappy -f -)

# Requires playerctl
bind = , XF86AudioNext, exec, $uwsm $(playerctl next)
bind = , XF86AudioPause, exec, $uwsm $(playerctl play-pause)
bind = , XF86AudioPlay, exec, $uwsm $(playerctl play-pause)
bind = , XF86AudioPrev, exec, $uwsm $(playerctl previous)
bind = , XF86Tools, exec, $uwsm $HOME/scripts/toggle_audio.sh
#bindel = , Menu, exec, $uwsm 

#emoji
bind = $Mod, B, exec, $uwsm $(rofimoji --selector rofi --clipboarder wl-copy --action copy)
#clipboard
bind = $Mod, V, exec, $uwsm $(cliphist list | rofi -dmenu | cliphist decode | wl-copy) 
#coding
bind = $Mod, C, exec, $uwsm $code

bind = $Mod, G, togglefloating,
bind = $Mod, G, pin, active

# monitor
bind = $Mod Alt, Up, exec, $uwsm $(ddcutil setvcp --bus 5 10 + 10)                                                                   
bind = $Mod Alt, Down, exec, $uwsm $(ddcutil setvcp --bus 5 10 - 10)  

# wallpaper switcher
bind = $Mod, bracketleft, exec, $uwsm $HOME/.config/rofi/wallpaper-changer.sh

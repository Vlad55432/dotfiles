# apps
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$uwsm = uwsm app --
$browser = vivaldi-stable.desktop
$code = code.desktop
$active-monitor = --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"
$apps_wofi = --conf ~/.config/wofi/config_apps --style ~/.config/wofi/style_apps.css 
# https://wiki.hyprland.org/Configuring/Environment-variables/

env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
env = HYPRCURSOR_THEME,Gruvbox-custom
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
